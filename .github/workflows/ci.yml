name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '8.2', '8.4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  php-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: dolibarr
        with:
          path: ${{ runner.temp }}/dolibarr
          key: dolibarr-24.0.2-label-core-v1
      - name: Fetch isolated Dolibarr label dependencies
        if: steps.dolibarr.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 24.0.2 --filter=blob:none --sparse \
            https://github.com/Dolibarr/dolibarr "${RUNNER_TEMP}/dolibarr"
          git -C "${RUNNER_TEMP}/dolibarr" sparse-checkout set \
            htdocs/core/modules/printsheet htdocs/core/class htdocs/core/lib \
            htdocs/includes/tecnickcom/tcpdf
      - name: Run every isolated PHP regression runner
        env:
          DOL_DOCUMENT_ROOT: ${{ runner.temp }}/dolibarr/htdocs
        run: |
          status=0
          for runner in tests/run_*.php; do
            echo "::group::$runner"
            php "$runner" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  stockapp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockapp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stockapp/package-lock.json
      - run: npm ci
      - run: npm run build
